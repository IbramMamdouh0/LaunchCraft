version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8080:8000" 
    volumes:
      - .:/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongodb_server
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: